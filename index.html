<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <meta name="description" content="Study notes: read, revise, understand and test yourself.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5bd3'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='Georgia,serif'%3E%CF%81%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hl-light" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hl-dark" disabled crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('notes:theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="read-progress"></div>
  <header class="topbar">
    <button class="icon-btn" id="menu-btn" aria-label="Toggle navigation">&#9776;</button>
    <a class="brand" href="#/">Notes</a>
    <div class="search">
      <input id="search" type="search" placeholder="Search  ( / )" autocomplete="off" aria-label="Search notes">
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode" title="Toggle theme">&#9680;</button>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Chapters"></nav>
    <main id="main" class="main" tabindex="-1">
      <div class="loading">Loading&hellip;</div>
    </main>
    <aside id="toc" class="toc" aria-label="On this page"></aside>
  </div>
  <div id="scrim" class="scrim" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" crossorigin="anonymous"></script>
  <script src="assets/js/plot.js"></script>
  <script src="assets/js/widgets.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
